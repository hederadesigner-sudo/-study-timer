<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="勉強タイマー">
<title>勉強タイマー</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#172033; --muted:#717b8d;
  --line:#e2e6ec; --accent:#5146e5; --accent-soft:#eceaff; --block:#5146e5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
h1{font-size:25px;margin:0 0 4px}.small{font-size:13px;color:var(--muted);line-height:1.45}
.timer{font-size:50px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:.015em;margin:18px 0 14px;text-align:center}
.primary{width:100%;min-height:54px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-size:17px;font-weight:750;cursor:pointer}
.primary.running{background:#171c27}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.stat{padding:13px 10px;border:1px solid var(--line);border-radius:15px;text-align:center;min-width:0}
.stat strong{display:block;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums}
.week-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.week-title h2{font-size:19px;margin:0}
.week-nav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:4px 0 4px}
.week-nav button{min-height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font-size:20px;font-weight:700;cursor:pointer}
.week-nav button:disabled{opacity:.3;cursor:default}
.week-range{text-align:center;font-size:14px;font-weight:700}
.week-sum{text-align:center;font-size:13px;color:var(--muted);margin:7px 0 2px}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;min-height:285px;padding:8px 1px 0}
.day{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:265px}
.blocks{width:100%;max-width:44px;height:210px;display:flex;flex-direction:column-reverse;justify-content:flex-start;overflow:hidden}
.block{width:100%;border-radius:2px;background:var(--block);flex:0 0 auto}
.block.partial{background:linear-gradient(to top,var(--block) var(--fill),#eef0f4 var(--fill));border:1px solid #d8dbe1}
.day.today .blocks{outline:2px solid var(--accent-soft);outline-offset:4px;border-radius:5px}
.minutes{font-size:10px;margin-top:8px;min-height:15px;color:var(--muted);white-space:nowrap;letter-spacing:-.02em}
.label{margin-top:2px;font-size:12px;font-weight:700}.date{font-size:10px;color:var(--muted)}
.legend{margin-top:10px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:13px}
.secondary{flex:1;min-height:46px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font-size:14px;font-weight:650;cursor:pointer}
.note{font-size:12px;line-height:1.65;color:var(--muted);padding:0 3px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:6px 9px;border-radius:999px;background:var(--accent-soft);font-size:12px;color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media(min-width:600px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .blocks{max-width:56px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>勉強タイマー</h1>
    <div class="small">「勉強開始」を押して、終わったら停止。15分ごとに今日の列が1ブロック伸びます。</div>
    <div class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">停止中</span></div>
    <div class="timer" id="timer">00:00:00</div>
    <button class="primary" id="toggle" type="button">▶ 勉強開始</button>

    <div class="stats">
      <div class="stat"><span class="small">今日</span><strong id="todayTotal">0分</strong></div>
      <div class="stat"><span class="small">今週</span><strong id="weekTotal">0分</strong></div>
      <div class="stat"><span class="small">総勉強時間</span><strong id="allTimeTotal">0分</strong></div>
      <div class="stat"><span class="small">今日の15分ブロック</span><strong id="blocksCount">0</strong></div>
    </div>
  </div>

  <div class="card">
    <div class="week-title">
      <h2>週ごとの勉強</h2>
      <div class="small">1ブロック＝15分</div>
    </div>
    <div class="week-nav">
      <button id="prevWeek" type="button" aria-label="前の週">‹</button>
      <div class="week-range" id="weekRange">-</div>
      <button id="nextWeek" type="button" aria-label="次の週">›</button>
    </div>
    <div class="week-sum" id="selectedWeekTotal">この週：0分</div>
    <div class="chart" id="chart"></div>
    <div class="legend">15分未満の途中分も表示します。24時間（96ブロック）まで対応し、その週の最大時間に合わせて自動で見やすく調整します。</div>
    <div class="actions">
      <button class="secondary" id="minus15" type="button">−15分</button>
      <button class="secondary" id="plus15" type="button">＋15分</button>
    </div>
  </div>

  <div class="note">
    記録はこの端末のSafariに保存されます。ページを閉じても、計測中なら開始時刻を保持し、次に開いたときに経過時間を反映します。
    <div id="recoveryStatus" style="margin-top:6px"></div>
  </div>
</div>

<script>
(() => {
  const KEY="study_timer_15min_v5";
  const SEEDED_DATE="2026-09-23";
  const SEEDED_SECONDS=146*60;
  const RECOVERED_SECONDS=358*60;

  const timerEl=document.getElementById("timer");
  const toggleBtn=document.getElementById("toggle");
  const todayTotalEl=document.getElementById("todayTotal");
  const blocksCountEl=document.getElementById("blocksCount");
  const weekTotalEl=document.getElementById("weekTotal");
  const allTimeTotalEl=document.getElementById("allTimeTotal");
  const weekRangeEl=document.getElementById("weekRange");
  const selectedWeekTotalEl=document.getElementById("selectedWeekTotal");
  const prevWeekBtn=document.getElementById("prevWeek");
  const nextWeekBtn=document.getElementById("nextWeek");
  const chartEl=document.getElementById("chart");
  const minusBtn=document.getElementById("minus15");
  const plusBtn=document.getElementById("plus15");
  const statusText=document.getElementById("statusText");
  const recoveryStatusEl=document.getElementById("recoveryStatus");
  let selectedWeekOffset=0;

  function dateKey(d=new Date()){
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }

  function defaultData(){
    return {days:{[SEEDED_DATE]:RECOVERED_SECONDS}, running:false, startedAt:null, runningDate:null};
  }

  const LEGACY_KEYS=[
    "study_timer_15min_v1",
    "study_timer_15min_v2",
    "study_timer_15min_v3",
    "study_timer_15min_v4",
    "study_timer_15min_v5",
    "study_timer_15min_v6",
    "study_timer_v6"
  ];

  function mergeRecoveredDays(target, source){
    if(!source || typeof source!=="object") return target;
    Object.entries(source).forEach(([k,v])=>{
      const sec=Number(v||0);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Number.isFinite(sec) || sec<0) return;
      target[k]=Math.max(Number(target[k]||0),sec);
    });
    return target;
  }

  function recoverLegacyDays(baseDays){
    const recovered={...baseDays};

    LEGACY_KEYS.forEach(key=>{
      try{
        const raw=localStorage.getItem(key);
        if(!raw) return;
        const obj=JSON.parse(raw);
        if(obj && obj.days) mergeRecoveredDays(recovered,obj.days);
      }catch(e){}
    });

    try{
      for(let i=0;i<localStorage.length;i++){
        const key=localStorage.key(i);
        if(!key || !key.startsWith("study-grid-")) continue;
        const d=key.slice("study-grid-".length);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
        const arr=JSON.parse(localStorage.getItem(key));
        if(!Array.isArray(arr)) continue;
        const sec=arr.filter(Boolean).length*900;
        recovered[d]=Math.max(Number(recovered[d]||0),sec);
      }
    }catch(e){}

    recovered[SEEDED_DATE]=Math.max(Number(recovered[SEEDED_DATE]||0),RECOVERED_SECONDS);
    return recovered;
  }

  function load(){
    let d=defaultData();
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(parsed && typeof parsed==="object") d=parsed;
      }
    }catch(e){}

    if(!d.days) d.days={};
    d.days=recoverLegacyDays(d.days);
    if(typeof d.running!=="boolean") d.running=false;
    if(!("startedAt" in d)) d.startedAt=null;
    if(!("runningDate" in d)) d.runningDate=null;

    try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){}
    return d;
  }

  function save(data){
    try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){}
  }

  function fmtMin(sec){
    const totalMin=Math.floor(Math.max(0,sec)/60);
    if(totalMin<60) return totalMin+"分";
    const h=Math.floor(totalMin/60),m=totalMin%60;
    return m ? h+"時間"+m+"分" : h+"時間";
  }

  function fmtClock(sec){
    sec=Math.max(0,Math.floor(sec));
    const h=String(Math.floor(sec/3600)).padStart(2,"0");
    const m=String(Math.floor((sec%3600)/60)).padStart(2,"0");
    const s=String(sec%60).padStart(2,"0");
    return h+":"+m+":"+s;
  }

  function currentLiveSeconds(data){
    if(!data.running || !data.startedAt) return 0;
    return Math.max(0,Math.floor((Date.now()-data.startedAt)/1000));
  }

  function splitRunningAcrossMidnight(data){
    if(!data.running || !data.startedAt || !data.runningDate) return data;
    const start=new Date(data.startedAt);
    const now=new Date();
    if(dateKey(start)===dateKey(now)) return data;

    let cursor=new Date(start);
    while(dateKey(cursor)!==dateKey(now)){
      const nextMidnight=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()+1);
      const sec=Math.max(0,Math.floor((nextMidnight-cursor)/1000));
      const k=dateKey(cursor);
      data.days[k]=Number(data.days[k]||0)+sec;
      cursor=nextMidnight;
    }
    data.startedAt=cursor.getTime();
    data.runningDate=dateKey(cursor);
    save(data);
    return data;
  }

  function weekDays(offset=0){
    const now=new Date();
    const day=(now.getDay()+6)%7;
    const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day+(offset*7));
    return Array.from({length:7},(_,i)=>new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i));
  }

  function weekRangeLabel(days){
    const a=days[0], b=days[6];
    const sameYear=a.getFullYear()===b.getFullYear();
    const start=sameYear ? (a.getMonth()+1)+"/"+a.getDate() : a.getFullYear()+"/"+(a.getMonth()+1)+"/"+a.getDate();
    const end=(b.getMonth()+1)+"/"+b.getDate();
    return start+"〜"+end;
  }

  function render(){
    let data=splitRunningAcrossMidnight(load());
    const live=currentLiveSeconds(data);
    const today=dateKey();
    const liveToday=data.running && data.runningDate===today ? live : 0;
    const todaySec=Number(data.days[today]||0)+liveToday;

    timerEl.textContent=fmtClock(live);
    todayTotalEl.textContent=fmtMin(todaySec);
    blocksCountEl.textContent=Math.floor(todaySec/900);

    const currentWeek=weekDays(0);
    const currentWeekSec=currentWeek.reduce((sum,d)=>{
      const k=dateKey(d);
      let sec=Number(data.days[k]||0);
      if(data.running && data.runningDate===k) sec+=live;
      return sum+sec;
    },0);
    weekTotalEl.textContent=fmtMin(currentWeekSec);

    const savedTotalSec=Object.values(data.days).reduce((sum,v)=>sum+Number(v||0),0);
    allTimeTotalEl.textContent=fmtMin(savedTotalSec+live);
    if(recoveryStatusEl){
      const dayCount=Object.keys(data.days).filter(k=>Number(data.days[k]||0)>0).length;
      recoveryStatusEl.textContent="保存済み記録："+dayCount+"日分";
    }

    if(data.running){
      toggleBtn.textContent="■ 勉強終了";
      toggleBtn.classList.add("running");
      statusText.textContent="計測中";
    }else{
      toggleBtn.textContent="▶ 勉強開始";
      toggleBtn.classList.remove("running");
      statusText.textContent="停止中";
    }

    chartEl.innerHTML="";
    let weekSec=0;
    const labels=["月","火","水","木","金","土","日"];
    const thisWeek=weekDays(selectedWeekOffset);
    weekRangeEl.textContent=weekRangeLabel(thisWeek);
    nextWeekBtn.disabled=selectedWeekOffset>=0;
    const weekValues=thisWeek.map(d=>{
      const k=dateKey(d);
      let sec=Number(data.days[k]||0);
      if(data.running && data.runningDate===k) sec+=live;
      return sec;
    });

    const maxSec=Math.max(0,...weekValues);
    const maxBlocks=Math.min(96,Math.ceil(maxSec/900));
    const displayBlocks=Math.max(12,maxBlocks||12);
    const gap=displayBlocks<=24?3:(displayBlocks<=48?2:1);
    const blockHeight=Math.max(1,Math.floor((210-gap*(displayBlocks-1))/displayBlocks));

    thisWeek.forEach((d,i)=>{
      const k=dateKey(d);
      let sec=weekValues[i];
      weekSec+=sec;

      const full=Math.floor(sec/900);
      const rem=sec%900;

      const dayEl=document.createElement("div");
      dayEl.className="day"+(k===today?" today":"");

      const blocks=document.createElement("div");
      blocks.className="blocks";
      blocks.style.gap=gap+"px";

      const shown=Math.min(full,displayBlocks);
      for(let j=0;j<shown;j++){
        const b=document.createElement("div");
        b.className="block";
        b.style.height=blockHeight+"px";
        b.style.minHeight=blockHeight+"px";
        blocks.appendChild(b);
      }
      if(rem>0 && full<displayBlocks){
        const b=document.createElement("div");
        b.className="block partial";
        b.style.height=blockHeight+"px";
        b.style.minHeight=blockHeight+"px";
        b.style.setProperty("--fill",Math.round(rem/900*100)+"%");
        blocks.appendChild(b);
      }

      const minutes=document.createElement("div");
      minutes.className="minutes";
      minutes.textContent=sec?fmtMin(sec):"0分";

      const label=document.createElement("div");
      label.className="label";
      label.textContent=labels[i];

      const date=document.createElement("div");
      date.className="date";
      date.textContent=(d.getMonth()+1)+"/"+d.getDate();

      dayEl.append(blocks,minutes,label,date);
      chartEl.appendChild(dayEl);
    });

    selectedWeekTotalEl.textContent="この週："+fmtMin(weekSec);
  }

  function start(){
    const data=load();
    if(data.running) return;
    data.running=true;
    data.startedAt=Date.now();
    data.runningDate=dateKey();
    save(data);
    render();
  }

  function stop(){
    let data=splitRunningAcrossMidnight(load());
    if(!data.running) return;
    const sec=currentLiveSeconds(data);
    const k=data.runningDate || dateKey();
    data.days[k]=Number(data.days[k]||0)+sec;
    data.running=false;
    data.startedAt=null;
    data.runningDate=null;
    save(data);
    render();
  }

  toggleBtn.addEventListener("click",()=>{
    const data=load();
    data.running?stop():start();
  });

  plusBtn.addEventListener("click",()=>{
    let data=load();
    if(data.running) stop();
    data=load();
    const k=dateKey();
    data.days[k]=Number(data.days[k]||0)+900;
    save(data);
    render();
  });

  minusBtn.addEventListener("click",()=>{
    let data=load();
    if(data.running) stop();
    data=load();
    const k=dateKey();
    data.days[k]=Math.max(0,Number(data.days[k]||0)-900);
    save(data);
    render();
  });

  prevWeekBtn.addEventListener("click",()=>{
    selectedWeekOffset-=1;
    render();
  });

  nextWeekBtn.addEventListener("click",()=>{
    if(selectedWeekOffset<0) selectedWeekOffset+=1;
    render();
  });

  render();
  setInterval(render,500);
})();
</script>
</body>
</html>
